name: gutsmash_pipeline_v2
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ── Core Python ────────────────────────────────────────────────────────────
  - python=3.11.13

  # ── Bioinformatics binaries (via bioconda/conda-forge) ────────────────────
  - bioconda::prodigal=2.6.3
  - bioconda::hmmer=3.4              # provides hmmscan, hmmsearch, hmmpress
  - bioconda::diamond=2.1.24
  - bioconda::muscle=5.3             # muscle v5 (outputs lowercase version string)
  - bioconda::salmon>=1.5.2 #Edited 4-7-26 after dependency issues
  - bioconda::cd-hit=4.8.1           # provides cd-hit-est
  - bioconda::seqtk=1.4
  - bioconda::blast=2.16.0           # provides blastn (needed by gutSMASH)

  # ── R and tidyverse packages (normalization step) ─────────────────────────
  - r-base>=4.2
  - r-readr=2.2.0
  - r-dplyr=1.2.0
  - r-tidyr=1.3.2

  # ── Python packages (pip-installed; exact versions from this session) ─────
  - pip
  - pip:
      # gutSMASH core dependencies (pinned to author-recommended versions [2])
      # NOTE: biopython 1.85 is used here (not 1.76 as in the original README)
      # because 1.76 is incompatible with Python 3.11. Eight compatibility
      # patches must be applied to gutSMASH after cloning — see PATCHES.md.
      - biopython==1.85
      - helperlibs==0.1.9
      - bcbio-gff==0.7.1 #Changed from gff==0.6.6, otherwise its distribute_setup.py uses http:// download
      - pysvg-py3==0.2.2.post3
      - pyScss==1.3.7
      - jinja2==3.1.6
      - markupsafe==3.0.2
      # Scientific stack (gutSMASH internal use)
      - numpy==2.1.0
      - scipy==1.15.0
      - scikit-learn==1.7.1
      - matplotlib==3.10.5
